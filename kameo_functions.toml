# kameo_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed,
# [[switch_tables]] the codegen mistranslates and [[midasm_hook]]s into src/. See POTCAWERecomp's
# potcawe_functions.toml and GRAWRecomp's yeti_functions.toml for examples of each.

# The C runtime's setjmp and longjmp (sub_826CC0E0 saves f14-f31, r13-r31, r1, LR and CR in the jmp_buf;
# sub_826CBFC0 unwinds to it and loads them back), the same code as in GRAWRecomp. The codegen turns calls
# to them into the host's setjmp and longjmp, keyed by the guest jmp_buf; translated as plain functions,
# longjmp would load the registers and return to its caller instead of jumping. XGraphics' shader compiler
# guards its work with them (sub_825FC638, sub_825FC848: setjmp at its context + 928) and its error
# function longjmps back; another library does the same (sub_82670FC0, sub_82671590).
setjmp_address = 0x826CC0E0
longjmp_address = 0x826CBFC0

# Codegen: the registers no call passes on are local variables of each function, not fields of the
# PPCContext, so the compiler keeps them in host registers and the __savegprlr/__restgprlr helpers are
# elided (SDK patch 0022 keeps the return address they store in the frame), as in GRAWRecomp and
# POTCAWERecomp. non_argument_as_local (r0, r2, r11, r12) stays off: the SEH funclets read r12, which the
# SDK does not pass them.
non_volatile_as_local = true
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true

[functions]
# The functions that call setjmp keep their registers in the context (share_registers): the host longjmp
# returns into their C++ frame, and the codegen restores the context it saved at the setjmp, not local
# variables. The guest longjmp loaded r14-r31 with their values at the setjmp.
0x825FC638 = { share_registers = true }   # XGraphics' shader compiler, the two guards
0x825FC848 = { share_registers = true }
# A [functions] entry replaces the function's .pdata size, and the analyzer does not know that longjmp
# never returns: without its end, sub_82670FC0 would run on past its last call to longjmp into the next.
0x82670FC0 = { share_registers = true, end = 0x82671590 }   # the other library's guards
0x82671590 = { share_registers = true }
# Branch (b) targets that the automatic analysis did not assign to any function: functions reached only
# through tail calls.
0x822F9158 = {}   # branched to from 0x822F92D4 (the dispatcher at 0x822F92AC, next to 0x822F9008)

# The game's waits for the GPU without spinning (src/gpu_wait.cpp): the D3D library waits for the
# command processor in four loops (fences, ring space, two more on GPU write-backs), each filling a
# hang-check record on the stack and calling the hang check sub_820D6D30 on every iteration; on PC they
# kept the main thread at 100 % of a core. kameo_gpu_wait_sleep_us = 0 disables it.
[[midasm_hook]]
address = 0x820CDE10   # stw r8,84(r1) (sub_820CDD80, fences: the record's start tick)
name = "KameoGpuWaitBeginHook"
[[midasm_hook]]
address = 0x820CD5D8   # stw r11,92(r1) (sub_820CD578, ring space)
name = "KameoGpuWaitBeginHook"
[[midasm_hook]]
address = 0x820CD11C   # stw r11,92(r1) (sub_820CD0C8)
name = "KameoGpuWaitBeginHook"
[[midasm_hook]]
address = 0x820D59CC   # stw r11,92(r1) (sub_820D57F8)
name = "KameoGpuWaitBeginHook"
[[midasm_hook]]
address = 0x820D6D30   # mflr r12 (entry of sub_820D6D30: every iteration of a wait)
name = "KameoGpuWaitSpinHook"

# Videos without a spinning thread (src/bink_io.cpp): Bink's 80 Hz timer thread services the video
# reader again and again while its buffer is less than half full, even while the reading is suspended
# and its Idle function does nothing. The hook treats a suspended reader as half full (once per tick).
# kameo_bink_io_fix = false disables it.
[[midasm_hook]]
address = 0x826CFDB8   # cmplwi cr6,r11,50 (sub_826CFDA0, r11 = buffer use in percent)
name = "KameoBinkIoPriorityHook"
registers = ["r3", "r11"]

# 60 FPS (src/framerate.cpp): the Direct3D library reads the D3DRS_PRESENTINTERVAL render state
# (device+13756, 2 in this game) in sub_820CF868 and encodes it into the swap descriptor for the
# vblank callback; the hook turns 2 into 1 when kameo_60fps is on.
[[midasm_hook]]
address = 0x820CF918   # cmplwi cr6,r10,1 (after lwz r10,13756(r31) in sub_820CF868)
name = "KameoPresentIntervalHook"
registers = ["r10"]

# Camera following at 60 FPS (src/framerate.cpp, ISpectre23's Xenia "FPS Camera Fix"): before the
# new camera position is written in sub_82440D28, the hook divides the X and Z differences
# target - current (f8, f6) by dt * 30 (f31) when kameo_60fps is on.
[[midasm_hook]]
address = 0x82440FA4   # fmadds f5,f8,f0,f13 (first of the three that write the position)
name = "KameoCameraFollowHook"
registers = ["f8", "f6", "f31"]

# Language (src/language.cpp): sub_820B4F08 turns Spanish into the game's Latin American Spanish (10,
# the "Mexican" folder) only on a North American console; the hook reports that region for Spanish
# when kameo_latin_american_spanish is on (the SDK's XGetGameRegion returns 0xFFFF).
[[midasm_hook]]
address = 0x820B5230   # cmplwi cr6,r31,5 (after bl XGetLanguage, mr r31,r3, bl XGetGameRegion)
name = "KameoLanguageHook"
registers = ["r31", "r3"]

# Ultrawide displays (src/widescreen.cpp), when kameo_ultrawide = true (the presenter stretches the 1280x720
# image) or NativeXRenderer fills a wider output; otherwise the hooks change nothing. The 3D views see more
# to the sides: sub_820DFD38 builds the perspective projection (r3 = the matrix, f1 = vertical fov, f2 = aspect
# ratio, f3/f4 = near/far; D3DXMatrixPerspectiveFovLH style) and sub_820ED110 a camera's culling frustum from
# the same fov and aspect ratio; both widen 16:9.
[[midasm_hook]]
address = 0x820DFD38   # mflr r12 (entry of sub_820DFD38)
name = "KameoProjectionAspectHook"
registers = ["f2"]
[[midasm_hook]]
address = 0x820ED16C   # li r5,252 (after lfs f12,4(r3): the camera's aspect ratio)
name = "KameoFrustumAspectHook"
registers = ["f12"]
# The 2D layer (HUD, menus, pause menu) kept at 16:9 in the center (kameo_ultrawide_hud): it is drawn through
# off-center orthographic projections of the screen in 640x480 or 1280x720 units, built by sub_820DFE20
# (f1 = top, f2 = bottom, f3 = left, f4 = right; text, menus) and by D3DXMatrixOrthoOffCenterLH at 0x8251CFF0
# (f1 = left, f2 = right, f3 = bottom, f4 = top; the HUD's sprites). The hooks narrow left/right around the
# center while the game draws into the 1280x720 screen. sub_8224B118 and sub_822D19E0 fill a rectangle through
# sub_820DFE20 (f2 = left, f4 = width): one across the whole width (a fade, the cinematics' bars) is left as it
# is. sub_82265558 draws a video frame in 1280x720 units (f1 = left, f3 = horizontal scale): kept at 16:9 with
# black sides.
[[midasm_hook]]
address = 0x820DFE20   # lis r11,-32248 (entry of sub_820DFE20)
name = "KameoOrthoAspectHook"
registers = ["f1", "f2", "f3", "f4"]
[[midasm_hook]]
address = 0x8251CFF0   # lis r11,-32248 (entry of D3DXMatrixOrthoOffCenterLH)
name = "KameoD3DXOrthoAspectHook"
registers = ["f1", "f2", "f3", "f4"]
[[midasm_hook]]
address = 0x8224B118   # mflr r12 (entry of sub_8224B118)
name = "KameoFillAspectHook"
registers = ["f2", "f4", "r9"]
[[midasm_hook]]
address = 0x822D19E0   # mflr r12 (entry of sub_822D19E0)
name = "KameoBarAspectHook"
registers = ["f2", "f4"]
[[midasm_hook]]
address = 0x82265558   # mflr r12 (entry of sub_82265558)
name = "KameoVideoAspectHook"
registers = ["f1", "f3"]

# Cinematics without the black bars (src/cinematics.cpp): sub_822712E0 draws the letterbox of the in-engine
# cinematics, two black rectangles of 1/8 of the screen's height through sub_822D19E0 (top and bottom), their
# height animated by a level at 0x82B70B08 + 3796 that the same code then lowers. With kameo_no_letterbox the hooks
# skip the two calls only, so the level keeps its course.
[[midasm_hook]]
address = 0x822713E4   # bl 0x822d19e0 (the top bar)
name = "KameoLetterboxBarHook"
jump_address_on_true = 0x822713E8
[[midasm_hook]]
address = 0x8227142C   # bl 0x822d19e0 (the bottom bar)
name = "KameoLetterboxBarHook"
jump_address_on_true = 0x82271430
