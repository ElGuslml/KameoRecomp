<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#18263D"/>
    <stop offset="1" stop-color="#0E1726"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.62" cy="0.46" r="0.6">
    <stop offset="0" stop-color="#2B4266" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#2B4266" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="440" height="760" fill="url(#sky)"/>
<rect width="440" height="760" fill="url(#glow)"/>
<g fill="none" stroke="#2A3D5E" stroke-width="1.5">
